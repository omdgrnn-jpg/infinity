<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .card {
      width: min(420px, 90vw);
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
      color: #d1d5db;
      gap: 6px;
    }

    input {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .hint {
      text-align: center;
      color: #9ca3af;
      margin-top: 14px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <form method="POST" action="/login">
      <label>
        Username
        <input type="text" name="username" value="admin" required />
      </label>

      <label>
        Password
        <input type="password" name="password" value="creatorisgay" required />
      </label>

      <button type="submit">Login</button>
    </form>

    <div class="hint">Use the admin account to manage authorized Roblox users.</div>
  </div>
</body>
</html>
